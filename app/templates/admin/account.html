{% extends "admin/base.html" %}
{% block title %}Hesabım{% endblock %}
{% block heading %}Hesabım{% endblock %}
{% block content %}
<section class="card narrow-card">
  <form method="post" action="/admin/account" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field">
      <span>Kullanıcı adı</span>
      <input name="username" value="{{ admin.username }}" autocomplete="username" minlength="3" required>
    </label>
    <label class="field">
      <span>Yeni şifre <em>(boş bırakırsan değişmez)</em></span>
      <input name="password" type="password" autocomplete="new-password" minlength="8">
    </label>
    <label class="field">
      <span>Yeni şifre tekrar</span>
      <input name="password2" type="password" autocomplete="new-password" minlength="8">
    </label>
    <hr>
    <label class="field">
      <span>Mevcut şifre <em>(onay için gerekli)</em></span>
      <input name="current" type="password" autocomplete="current-password" required>
    </label>
    <div><button class="btn btn-primary" type="submit">Güncelle</button></div>
  </form>
</section>
{% endblock %}
