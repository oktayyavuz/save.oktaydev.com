{% extends "admin/auth_base.html" %}
{% block title %}Giriş{% endblock %}
{% block auth %}
<h1 class="auth-title">Tekrar hoş geldin</h1>
<p class="muted">Devam etmek için giriş yap.</p>
{% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
<form method="post" action="/admin/login" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ request.query_params.get('next', '') }}">
  <label class="field">
    <span>Kullanıcı adı</span>
    <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
  </label>
  <label class="field">
    <span>Şifre</span>
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button class="btn btn-primary btn-block" type="submit">Giriş yap</button>
</form>
{% endblock %}
